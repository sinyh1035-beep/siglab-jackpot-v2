name: SIGVIEW 잭팟 시즌2 v2.0 (GitHub Pages)

on:
  schedule:
    # 매일 19:00 UTC = 다음날 04:00 KST
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  scan-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance finance-datareader pandas numpy scipy requests python-dotenv

      - name: Run scanner v2
        run: python fetch_data_v2.py

      - name: Commit jackpot-v2.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jackpot-v2.json
          git diff --cached --quiet || git commit -m "auto: update jackpot-v2.json $(date +%Y-%m-%d)"
          git push
